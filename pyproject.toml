[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graver"
version = "0.3.0"
description = "Git-like version control for LLM prompts"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
  {name = "Practical Mind"}
]
keywords = ["prompt", "versioning", "llm", "ai", "agents", "version-control"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
gr = "graver.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "black>=23.0",
  "ruff>=0.1.0",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/PracticalMind/graver"
Repository = "https://github.com/PracticalMind/graver"
Issues = "https://github.com/PracticalMind/graver/issues"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["graver"]
exclude = ["tests/"]

[tool.hatch.build.targets.sdist]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["graver"]
